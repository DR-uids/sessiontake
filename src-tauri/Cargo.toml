[package]
name = "memtrans"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
zstd = "0.13"

[profile.release]
strip = true
lto = true
codegen-units = 1

[build-dependencies.cc]
version = "1"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["clock"]
